# Standalone benchmark client — its own [workspace] so the parent atipicial-rs
# workspace ignores it (build it from this directory).
[workspace]

[package]
name = "atipicial-bench-client"
version = "0.1.0"
edition = "2021"
description = "JSON-RPC load generator for cross-implementation Atipicial N3 node benchmarks (atipicial-rs vs atipicial-cli vs atipicial-go)"

[[bin]]
name = "atipicial-bench"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
