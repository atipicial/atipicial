[package]
name = "atipicial-benches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Criterion benchmarks for the atipicial-rs workspace"

# This is a workspace member used only for benchmark targets. It is not linked
# into the running node or published as a crate.
# Run with: cargo bench -p atipicial-benches

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
criterion = { workspace = true }
atipicial-blockchain = { workspace = true }
atipicial-config = { workspace = true }
atipicial-crypto = { workspace = true }
atipicial-execution = { workspace = true }
atipicial-io = { workspace = true }
atipicial-native-contracts = { workspace = true }
atipicial-primitives = { workspace = true }
atipicial-runtime = { workspace = true }
atipicial-state-packs = { workspace = true }
atipicial-state-service = { workspace = true }
atipicial-storage = { workspace = true }
atipicial-system = { workspace = true }
atipicial-vm = { workspace = true }
atipicial-payloads = { workspace = true }
parity-db = "=0.5.5"
hex = { workspace = true }
num-bigint = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "mdbx-persistence-bench"
path = "src/bin/mdbx_persistence_bench.rs"

[[bin]]
name = "append-persistence-bench"
path = "src/bin/append_persistence_bench.rs"

[[bin]]
name = "paritydb-persistence-bench"
path = "src/bin/paritydb_persistence_bench.rs"

[[bench]]
name = "block_import"
path = "benches/blockchain/block_import.rs"
harness = false

[[bench]]
name = "block_processing"
path = "benches/payloads/block_processing.rs"
harness = false

[[bench]]
name = "state_root"
path = "benches/crypto/state_root.rs"
harness = false

[[bench]]
name = "state_service"
path = "benches/state/state_service.rs"
harness = false

[[bench]]
name = "storage_commit"
path = "benches/storage/storage_commit.rs"
harness = false

[[bench]]
name = "segment_set_publication"
path = "benches/storage/segment_set_publication.rs"
harness = false

[[bench]]
name = "vm_execution"
path = "benches/vm/vm_execution.rs"
harness = false

[lints]
workspace = true
