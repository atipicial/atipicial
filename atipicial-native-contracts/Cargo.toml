[package]
name = "atipicial-native-contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "Canonical home for Atipicial's native contracts (ATC, GAS, Policy, Oracle, Notary, StdLib, CryptoLib, etc.) and the shared NativeContract infrastructure"

[dependencies]
# Lower protocol, execution, storage, and VM layers
atipicial-primitives = { workspace = true }
atipicial-error = { workspace = true }
atipicial-io = { workspace = true }
atipicial-crypto = { workspace = true }
atipicial-vm = { workspace = true }
atipicial-config = { workspace = true }
atipicial-storage = { workspace = true }
atipicial-manifest = { workspace = true }
atipicial-serialization = { workspace = true }
atipicial-payloads = { workspace = true }
atipicial-runtime = { workspace = true }
# The execution layer provides the ApplicationEngine that native contracts
# call into (and the abstract NativeContract trait they implement).
atipicial-execution = { workspace = true }

# External crates actually referenced by source (others are pulled in
# transitively via the foundation/VM layer above and don't need to be
# declared directly).
serde = { workspace = true }
hex = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }

[[test]]
name = "native_manifest_pinning"
path = "tests/native_manifest_pinning/mod.rs"

[lints]
workspace = true
