[package]
name = "atipicial-network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "Atipicial N3 P2P transport, wire protocol, peer sessions, downloads, and network services"

[dependencies]
# Lower foundation / infrastructure layers
atipicial-primitives = { workspace = true }
atipicial-error = { workspace = true }
atipicial-config = { workspace = true }
atipicial-crypto = { workspace = true }

# Protocol types and binary wire helpers
atipicial-io = { workspace = true }
atipicial-payloads = { workspace = true }

# Domain service vocabulary
atipicial-runtime = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true, features = ["codec"] }
bytes = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }

# Errors / logging
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[[test]]
name = "handshake"
path = "tests/handshake/mod.rs"

[[test]]
name = "integration"
path = "tests/service/integration.rs"

[features]
default = []

[lints]
workspace = true
